[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "find-coffee-cambodia"
version = "0.1.0"
description = "Download Cambodian café data and find nearby cafés with PostGIS."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1.0,<2",
    "requests>=2.32,<3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "alembic>=1.13,<2",
    "SQLAlchemy>=2.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "httpx>=0.27,<1"]

[project.scripts]
find-coffee = "scripts.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "scripts*"]

[tool.setuptools.package-data]
app = ["sql/*.sql", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a dedicated PostGIS test database"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
